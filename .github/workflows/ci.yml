name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: torq
          POSTGRES_PASSWORD: torq
          POSTGRES_DB: torq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U torq -d torq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm install
      - name: Unit tests against Postgres
        env:
          DATABASE_URL: postgres://torq:torq@localhost:5432/torq
        # npm test clears DATABASE_URL so the default suite stays on PGlite.
        # One file at a time: every file shares this database and its migrations.
        run: npx vitest run --no-file-parallelism
